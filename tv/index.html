<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live VT Player</title>
  
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 60%, #020617 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.8s ease;
      position: relative;
    }

    /* Ambient Dynamic Glowing Background Overlay */
    .dynamic-bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at center top, rgba(225, 29, 72, 0.25) 0%, transparent 70%);
      filter: blur(80px);
      transition: all 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.85;
    }

    /* Fixed Top-Right Root Home Button */
    .root-home-btn {
      position: fixed;
      top: 6px;
      right: 14px;
      z-index: 10000;
      width: 42px;
      height: 42px;
      background: rgba(18, 22, 25, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.25s ease, box-shadow 0.25s ease;
    }

    .root-home-btn img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
      transition: transform 0.25s ease;
    }

    .root-home-btn:hover {
      transform: scale(1.1);
      background: rgba(28, 34, 40, 0.85);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .root-home-btn:active {
      transform: scale(0.92);
    }

    /* Fixed Top-Middle Logo */
    .top-logo {
      position: fixed;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      max-height: 42px;
      width: auto;
      z-index: 1000;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      pointer-events: none;
    }

    /* Top Red Navigation Bar */
    .navbar {
      background-color: #a81c2d;
      color: #ffffff;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 0;
      z-index: 500;
    }

    /* Triple Dot Menu Button */
    .nav-left {
      font-size: 1.6rem;
      cursor: pointer;
      user-select: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s ease, transform 0.15s ease;
      position: relative;
    }

    .nav-left:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .nav-left:active {
      transform: scale(0.92);
    }

    /* Dropdown Filter Box from Triple Dot */
    .dropdown-filter-panel {
      display: none;
      position: absolute;
      top: 60px;
      left: 14px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
      width: 280px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      flex-direction: column;
      gap: 12px;
      z-index: 900;
      animation: dropFade 0.2s ease forwards;
    }

    .dropdown-filter-panel.active {
      display: flex;
    }

    @keyframes dropFade {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-filter-panel label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .search-input, .category-select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .category-select option {
      background: #0f172a;
      color: #f8fafc;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .search-input:focus, .category-select:focus {
      border-color: #ef4444;
      background: rgba(255, 255, 255, 0.12);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px;
      flex: 1;
      position: relative;
      z-index: 10;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }

    /* Circular Channel Grid */
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 22px;
      justify-items: center;
      padding: 10px 0;
    }

    .channel-circle-card {
      width: 105px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.25s ease;
    }

    .channel-circle-card:hover {
      transform: translateY(-6px) scale(1.04);
    }

    .circle-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .channel-circle-card:hover .circle-wrapper {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.65);
    }

    .channel-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .channel-name {
      margin-top: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      letter-spacing: 0.3px;
    }

    /* Modal Player Popup */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0b0f17;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      width: 100%;
      max-width: 820px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 14px 18px;
      background: #111827;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close-btn:hover {
      color: #ffffff;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    .modal-footer {
      padding: 12px 18px;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-badge {
      color: #34d399;
      font-weight: 500;
    }

    .error-link {
      color: #f87171;
      text-decoration: underline;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .root-home-btn {
        top: 8px;
        right: 10px;
        width: 38px;
        height: 38px;
      }
      .root-home-btn img {
        width: 19px;
        height: 19px;
      }
      .top-logo {
        top: 8px;
        max-height: 36px;
      }
      .dropdown-filter-panel {
        width: calc(100vw - 28px);
        left: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Animated Color Gradient Background Glow -->
  <div class="dynamic-bg-glow" id="dynamicBg"></div>

  <!-- Fixed Top-Right Home Button -->
  <a href="../" class="root-home-btn" title="Back to Home">
    <img src="https://i.postimg.cc/yd4m5DsN/home.png" alt="Home">
  </a>

  <!-- Fixed Top-Middle Logo -->
  <img src="https://i.postimg.cc/Mpmd1bST/logo.png" alt="Logo" class="top-logo">

  <!-- Top Red Navbar -->
  <header class="navbar">
    <!-- Triple Dot Menu Button -->
    <div class="nav-left" id="menuToggleBtn" title="Search & Categories">⋮</div>
    
    <!-- Hidden Dropdown Filter Panel -->
    <div class="dropdown-filter-panel" id="dropdownFilter">
      <div>
        <label for="search-box">Search Channel</label>
        <input type="text" id="search-box" class="search-input" placeholder="Search..." oninput="filterChannels()">
      </div>
      <div>
        <label for="category-filter">Category</label>
        <select id="category-filter" class="category-select" onchange="filterChannels()">
          <option value="ALL">All Categories</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Container -->
  <main class="container">
    <div class="header-bar">
      <h1 class="page-title">Live Channels</h1>
    </div>

    <!-- Circle Grid -->
    <div id="channel-grid" class="channel-grid">
      <p style="color:#94a3b8;">Loading channels...</p>
    </div>
  </main>

  <!-- Modal Video Player Popup -->
  <div id="player-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-channel-name" class="modal-title">Live Stream</span>
        <button class="modal-close-btn" onclick="closePlayerModal()">&times;</button>
      </div>
      <div class="video-box">
        <video id="modal-video-player" controls autoplay playsinline muted></video>
      </div>
      <div class="modal-footer">
        <span id="stream-status" class="status-badge">Connecting...</span>
        <a id="modal-vlc-link" href="#" target="_blank" class="error-link" style="display:none;">Open Stream Link</a>
      </div>
    </div>
  </div>

  <script>
    const M3U_URL = 'tv.m3u';
    const PROXY_BASE = "https://bdtv.balaramdey.workers.dev/?url=";

    const channelGrid = document.getElementById('channel-grid');
    const categorySelect = document.getElementById('category-filter');
    const searchBox = document.getElementById('search-box');
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const dropdownFilter = document.getElementById('dropdownFilter');
    const dynamicBg = document.getElementById('dynamicBg');

    const modal = document.getElementById('player-modal');
    const modalVideo = document.getElementById('modal-video-player');
    const modalTitle = document.getElementById('modal-channel-name');
    const modalStatus = document.getElementById('stream-status');
    const modalVlcLink = document.getElementById('modal-vlc-link');

    let allChannels = [];
    let hls = null;
    let currentChannel = null;
    let triedProxy = false;

    // Toggle Dropdown Filter on Triple Dot Click
    menuToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownFilter.classList.toggle('active');
    });

    dropdownFilter.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // Close dropdown on outside click
    document.addEventListener('click', () => {
      dropdownFilter.classList.remove('active');
    });

    async function loadM3U() {
      try {
        let response = await fetch(M3U_URL);
        if (!response.ok) {
          response = await fetch('https://dlpl2025.github.io/travelvt/indiantv/tv.m3u');
        }
        const text = await response.text();
        allChannels = parseM3U(text);

        if (allChannels.length === 0) {
          throw new Error("No channels found in M3U file!");
        }

        buildCategoryDropdown();
        renderGrid(allChannels);
      } catch (err) {
        channelGrid.innerHTML = `<p style="color:#ef4444; grid-column: 1 / -1;">Error: ${err.message}</p>`;
      }
    }

    function parseM3U(data) {
      const lines = data.split('\n');
      const channels = [];
      let currentInfo = {};

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          const nameParts = line.split(',');
          const name = nameParts.slice(1).join(',').trim();

          currentInfo = {
            name: name || "Channel " + (channels.length + 1),
            logo: logoMatch ? logoMatch[1] : "",
            category: groupMatch ? groupMatch[1] : "General"
          };
        } else if (line && !line.startsWith('#')) {
          channels.push({
            name: currentInfo.name || "Channel " + (channels.length + 1),
            logo: currentInfo.logo || "",
            category: currentInfo.category || "General",
            url: line
          });
          currentInfo = {};
        }
      }
      return channels;
    }

    function buildCategoryDropdown() {
      const categories = [...new Set(allChannels.map(c => c.category))].filter(Boolean);
      categories.sort();
      categorySelect.innerHTML = '<option value="ALL">All Categories</option>';
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      });
    }

    function filterChannels() {
      const selectedCat = categorySelect.value;
      const searchVal = searchBox.value.toLowerCase();

      const filtered = allChannels.filter(ch => {
        const matchesCategory = selectedCat === "ALL" || ch.category === selectedCat;
        const matchesSearch = ch.name.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      renderGrid(filtered);
    }

    function renderGrid(channels) {
      channelGrid.innerHTML = '';
      if (channels.length === 0) {
        channelGrid.innerHTML = '<p style="color:#94a3b8; grid-column: 1 / -1;">No channels found.</p>';
        return;
      }

      channels.forEach((ch) => {
        const card = document.createElement('div');
        card.className = 'channel-circle-card';

        const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='7' width='20' height='15' rx='2' ry='2'></rect><polyline points='17 2 12 7 7 2'></polyline></svg>";
        const logoSrc = ch.logo && ch.logo.startsWith('http') ? ch.logo : fallbackImg;

        card.innerHTML = `
          <div class="circle-wrapper">
            <img class="channel-logo-img" src="${logoSrc}" onerror="this.src='${fallbackImg}'" alt="${ch.name}" />
          </div>
          <div class="channel-name" title="${ch.name}">${ch.name}</div>
        `;

        card.onclick = () => openPlayerModal(ch);
        channelGrid.appendChild(card);
      });
    }

    // Dynamic Color Gradient Generator based on Channel name & logo
    function applyChannelGradient(channel) {
      let hash = 0;
      for (let i = 0; i < channel.name.length; i++) {
        hash = channel.name.charCodeAt(i) + ((hash << 5) - hash);
      }

      const hue1 = Math.abs(hash % 360);
      const hue2 = (hue1 + 55) % 360;

      const color1 = `hsl(${hue1}, 75%, 32%)`;
      const color2 = `hsl(${hue2}, 85%, 22%)`;

      document.body.style.background = `radial-gradient(circle at 50% 15%, hsl(${hue1}, 45%, 15%) 0%, #080d1a 65%, #020617 100%)`;
      dynamicBg.style.background = `radial-gradient(circle at center top, ${color1} 0%, ${color2} 45%, transparent 75%)`;
    }

    function openPlayerModal(channel) {
      currentChannel = channel;
      triedProxy = false;
      modalTitle.textContent = channel.name;
      modalVlcLink.href = channel.url;
      modalVlcLink.style.display = 'none';
      modalStatus.textContent = "Connecting stream...";
      modalStatus.style.color = "#34d399";
      modal.classList.add('active');

      // Change background gradient based on channel
      applyChannelGradient(channel);

      dropdownFilter.classList.remove('active');
      playStream(channel.url);
    }

    function playStream(url) {
      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          manifestLoadingTimeOut: 20000,
          levelLoadingTimeOut: 20000,
          fragLoadingTimeOut: 20000,
          maxBufferLength: 30,
          maxMaxBufferLength: 60
        });

        hls.loadSource(url);
        hls.attachMedia(modalVideo);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          modalVideo.play().catch(() => {});
          modalStatus.textContent = triedProxy ? "● Live (Proxy Mode)" : "● Live Playing";
          modalStatus.style.color = "#34d399";
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (!triedProxy && currentChannel) {
              triedProxy = true;
              modalStatus.textContent = "Direct stream failed, switching to proxy...";
              modalStatus.style.color = "#fbbf24";
              playStream(PROXY_BASE + encodeURIComponent(currentChannel.url));
            } else {
              hls.destroy();
              modalStatus.textContent = "Stream playback failed.";
              modalStatus.style.color = "#f87171";
              modalVlcLink.style.display = 'inline';
            }
          }
        });
      } else if (modalVideo.canPlayType('application/vnd.apple.mpegurl')) {
        modalVideo.src = url;
        modalVideo.play().catch(() => {});
      }
    }

    function closePlayerModal() {
      modal.classList.remove('active');
      if (hls) {
        hls.destroy();
        hls = null;
      }
      modalVideo.pause();
      modalVideo.src = "";
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closePlayerModal();
      }
    });

    window.addEventListener('DOMContentLoaded', loadM3U);
  </script>
</body>
</html>
