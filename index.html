<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>bdey.online</title>

  <!-- PWA Meta & Manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#030305" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <style>
    /* CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030305;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Animated Red and Green Gradient Background */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #070a09 0%, #020202 100%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.45;
      will-change: transform;
    }

    .orb-green-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #00b347 0%, #006622 70%, transparent 100%);
      top: -10%;
      left: -12%;
      animation: floatOrbit1 18s ease-in-out infinite alternate;
    }

    .orb-red-1 {
      width: 540px;
      height: 540px;
      background: radial-gradient(circle, #cc1133 0%, #7a0014 70%, transparent 100%);
      bottom: -12%;
      right: -12%;
      animation: floatOrbit2 22s ease-in-out infinite alternate;
    }

    .orb-green-2 {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, #059669 0%, #047857 70%, transparent 100%);
      bottom: 10%;
      left: 15%;
      animation: floatOrbit3 24s ease-in-out infinite alternate;
    }

    .orb-red-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #be123c 0%, #881337 70%, transparent 100%);
      top: 10%;
      right: 15%;
      animation: floatOrbit1 20s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrbit1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 80px) scale(1.12); }
      100% { transform: translate(-40px, 100px) scale(0.92); }
    }

    @keyframes floatOrbit2 {
      0% { transform: translate(0px, 0px) scale(0.95); }
      50% { transform: translate(-80px, -50px) scale(1.15); }
      100% { transform: translate(30px, -90px) scale(1); }
    }

    @keyframes floatOrbit3 {
      0% { transform: translate(0px, 0px) scale(1.08); }
      50% { transform: translate(70px, -70px) scale(0.88); }
      100% { transform: translate(-50px, 30px) scale(1.04); }
    }

    /* Fixed Top Center Logo */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(3, 4, 6, 0.4);
    }

    .header-logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 10px 0;
      text-decoration: none;
      cursor: pointer;
    }

    .header-logo-container img {
      max-height: 52px;
      max-width: 180px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.75));
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .header-logo-container:hover img {
      transform: scale(1.08);
      filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.9));
    }

    .header-logo-container:active img {
      transform: scale(0.96);
    }

    /* Main Container */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 980px;
      padding: 95px 16px 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Grid Layout */
    .icons-grid {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      justify-items: center;
      align-items: center;
    }

    /* Icon Cards */
    .icon-card {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 200px;
      background: rgba(14, 18, 20, 0.5);
      border: none;
      outline: none;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 36px -6px rgba(0, 0, 0, 0.75), 
                  0 8px 16px rgba(0, 0, 0, 0.55);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
                  box-shadow 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
                  background 0.25s ease;
    }

    .icon-card img,
    .icon-card svg {
      width: 78%;
      height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.65));
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .icon-card:hover {
      transform: translateY(-6px) scale(1.04);
      background: rgba(22, 28, 32, 0.65);
      box-shadow: 0 24px 44px -4px rgba(0, 0, 0, 0.88), 
                  0 12px 22px rgba(0, 0, 0, 0.65);
    }

    .icon-card:hover img,
    .icon-card:hover svg {
      transform: scale(1.06);
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.8));
    }

    .icon-card:active {
      transform: scale(0.96);
    }

    @media (max-width: 860px) {
      .icons-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .icon-card {
        max-width: 170px;
        border-radius: 22px;
      }
      .icon-card img,
      .icon-card svg {
        width: 80%;
        height: 80%;
      }
    }

    @media (max-width: 580px) {
      .top-header {
        height: 68px;
      }
      .header-logo-container img {
        max-height: 42px;
      }
      main {
        padding: 85px 14px 24px;
      }
      .icons-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        max-width: 380px;
      }
      .icon-card {
        max-width: 100%;
        border-radius: 20px;
        box-shadow: 0 14px 26px -4px rgba(0, 0, 0, 0.75);
      }
      .icon-card img,
      .icon-card svg {
        width: 78%;
        height: 78%;
      }
    }
  </style>
</head>
<body>

  <div class="animated-bg">
    <div class="glow-orb orb-green-1"></div>
    <div class="glow-orb orb-red-1"></div>
    <div class="glow-orb orb-green-2"></div>
    <div class="glow-orb orb-red-2"></div>
  </div>

  <header class="top-header">
    <a href="index.html" class="header-logo-container" title="Home">
      <img src="logo.png" alt="Home Logo" />
    </a>
  </header>

  <main>
    <div class="icons-grid">
      <a href="radio/" class="icon-card">
        <img src="https://i.postimg.cc/7LT0TpTZ/fb.png" alt="Radio" />
      </a>
      <a href="tv/index.html" class="icon-card">
        <img src="https://i.postimg.cc/QC63DYm1/tv.png" alt="TV" />
      </a>
      <a href="sport/index.html" class="icon-card">
        <img src="https://i.postimg.cc/qqmTrDwK/sport.png" alt="Sport" />
      </a>
      <a href="music/" class="icon-card">
        <img src="https://i.postimg.cc/D0CThp6X/music.png" alt="Music" />
      </a>
      <a href="gallary/index.html" class="icon-card">
        <img src="https://i.postimg.cc/yN6njg1F/gallary.gif" alt="Gallery" />
      </a>
      <a href="ebook/index.html" class="icon-card">
        <img src="https://i.postimg.cc/pLJqKYH2/ebook.gif" alt="Ebook" />
      </a>
      <a href="magazine/index.html" class="icon-card">
        <img src="https://i.postimg.cc/4y8gG2Ph/old.png" alt="Magazine" />
      </a>
      <a href="telegram/index.html" class="icon-card">
        <img src="https://i.postimg.cc/kg3j4FHQ/txp.png" alt="Telegram" />
      </a>

      <!-- Bus Icon -->
      <a href="bus/" class="icon-card" title="Bus">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#34d399"/>
              <stop offset="100%" stop-color="#059669"/>
            </linearGradient>
          </defs>
          <!-- Side Mirrors -->
          <rect x="16" y="42" width="6" height="16" rx="3" fill="#047857"/>
          <rect x="98" y="42" width="6" height="16" rx="3" fill="#047857"/>
          <!-- Wheels -->
          <rect x="28" y="94" width="14" height="14" rx="4" fill="#1e293b"/>
          <rect x="78" y="94" width="14" height="14" rx="4" fill="#1e293b"/>
          <!-- Main Bus Body -->
          <rect x="22" y="18" width="76" height="80" rx="16" fill="url(#busBody)"/>
          <!-- Route Board -->
          <rect x="38" y="24" width="44" height="8" rx="4" fill="#064e3b"/>
          <!-- Windshield -->
          <rect x="29" y="36" width="62" height="30" rx="8" fill="#0f172a"/>
          <path d="M33 40 L52 40 L40 62 L33 62 Z" fill="#38bdf8" opacity="0.25"/>
          <!-- Front Grill -->
          <rect x="46" y="76" width="28" height="10" rx="3" fill="#064e3b"/>
          <!-- Headlights -->
          <circle cx="34" cy="81" r="5.5" fill="#fef08a"/>
          <circle cx="86" cy="81" r="5.5" fill="#fef08a"/>
        </svg>
      </a>

      <!-- Metro Icon -->
      <a href="metro/" class="icon-card" title="Metro">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="metroBody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f43f5e"/>
              <stop offset="100%" stop-color="#be123c"/>
            </linearGradient>
          </defs>
          <!-- Railway Tracks -->
          <path d="M36 96 L24 110 M84 96 L96 110" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
          <line x1="26" y1="104" x2="94" y2="104" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
          <!-- Pantograph (Top Connector) -->
          <path d="M46 18 L60 11 L74 18" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Metro Train Body -->
          <rect x="26" y="18" width="68" height="78" rx="18" fill="url(#metroBody)"/>
          <!-- Top Display -->
          <rect x="42" y="24" width="36" height="7" rx="3.5" fill="#4c0519"/>
          <!-- Front Glass -->
          <rect x="33" y="35" width="54" height="32" rx="9" fill="#0f172a"/>
          <path d="M37 39 L56 39 L44 63 L37 63 Z" fill="#bae6fd" opacity="0.25"/>
          <!-- Center Stripe -->
          <rect x="26" y="71" width="68" height="5" fill="#fecdd3"/>
          <!-- Headlights -->
          <circle cx="38" cy="84" r="5" fill="#fef08a"/>
          <circle cx="82" cy="84" r="5" fill="#fef08a"/>
        </svg>
      </a>
    </div>
  </main>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('SW Registered:', reg.scope))
          .catch((err) => console.error('SW Registration Failed:', err));
      });
    }
  </script>

</body>
</html>
