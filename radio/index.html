<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Akashvani Royal 1958 — 3D Vintage Radio</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Cinzel Decorative, Playfair Display, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- HLS.js for Live M3U8 Radio Streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            royal: ['"Cinzel Decorative"', 'serif'],
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            royal: {
              950: '#040712',
              900: '#080e24',
              800: '#0f1a3d',
              700: '#172759',
              gold: '#d4af37',
              goldLight: '#f3d778',
              goldDark: '#997a15',
              amber: '#ff9d2e',
              emerald: '#10b981',
              mahogany: '#260b10'
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #131f47 0%, #070b1a 58%, #03050c 100%);
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Royal Glassmorphism Panels */
    .royal-glass {
      background: linear-gradient(145deg, rgba(11, 18, 42, 0.78), rgba(6, 10, 24, 0.88));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.28);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(243, 215, 120, 0.15);
    }

    .gold-text-gradient {
      background: linear-gradient(180deg, #fae392 0%, #d4af37 52%, #9e7b16 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Custom Brass Range Sliders */
    input[type="range"].royal-slider {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(212, 175, 55, 0.18);
      height: 5px;
      border-radius: 999px;
      outline: none;
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    input[type="range"].royal-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff0b3, #d4af37 65%, #7c5e08);
      border: 1.5px solid #fff3c4;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type="range"].royal-slider::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    input[type="range"].royal-slider::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff0b3, #d4af37 65%, #7c5e08);
      border: 1.5px solid #fff3c4;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.7);
      cursor: pointer;
    }

    /* Custom Scrollbar for Station Drawer */
    .royal-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .royal-scroll::-webkit-scrollbar-track {
      background: rgba(8, 14, 36, 0.5);
      border-radius: 10px;
    }
    .royal-scroll::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.45);
      border-radius: 10px;
    }
    .royal-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(212, 175, 55, 0.8);
    }

    /* Equalizer Bars Animation */
    @keyframes eqPulse {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
    }
    .eq-bar {
      transform-origin: bottom;
      animation: eqPulse 0.8s ease-in-out infinite;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; animation-duration: 0.65s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; animation-duration: 0.9s; }
    .eq-bar:nth-child(4) { animation-delay: 0.15s; animation-duration: 0.7s; }

    /* Interactive Hover Tooltip in 3D */
    #hover-badge {
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
  </style>
</head>
<body>

  <!-- Hidden HTML5 Audio Element -->
  <audio id="radio-audio" crossOrigin="anonymous" playsinline></audio>

  <!-- 3D Viewport Container -->
  <div id="canvas-container"></div>

  <!-- Floating 3D Part Tooltip -->
  <div id="hover-badge" class="fixed z-30 opacity-0 px-3 py-1.5 rounded-full royal-glass text-xs font-medium text-royal-goldLight border border-royal-gold/40 shadow-lg flex items-center gap-1.5">
    <span class="w-1.5 h-1.5 rounded-full bg-royal-gold animate-ping"></span>
    <span id="hover-badge-text">Interactive Control</span>
  </div>

  <!-- TOP ROYAL HUD BAR -->
  <header class="fixed top-3 left-3 right-3 sm:top-4 sm:left-5 sm:right-5 z-20 pointer-events-none flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-2.5">
    
    <!-- Brand Title & On-Air Status -->
    <div class="pointer-events-auto royal-glass rounded-2xl px-4 py-2.5 flex items-center justify-between sm:justify-start gap-4">
      <div class="flex items-center gap-3">
        <!-- Royal Emblem SVG -->
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-royal-gold/30 to-royal-900 border border-royal-gold/50 flex items-center justify-center shadow-inner shrink-0">
          <svg class="w-5 h-5 text-royal-goldLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3" />
            <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14" />
          </svg>
        </div>
        <div>
          <h1 class="font-royal text-sm sm:text-base md:text-lg tracking-wider gold-text-gradient leading-tight">
            ROYAL VINTAGE RADIO
          </h1>
          <p class="text-[10px] sm:text-xs text-slate-400 tracking-widest uppercase">
            Akashvani Imperial Edition • 1958
          </p>
        </div>
      </div>

      <!-- Status Pill -->
      <div id="status-pill" class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900/90 border border-slate-700/80 text-[11px] font-mono tracking-wider">
        <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span id="status-text" class="text-slate-300">STANDBY</span>
      </div>
    </div>

    <!-- Right Telemetry: Signal Strength & Camera Angles -->
    <div class="pointer-events-auto royal-glass rounded-2xl px-3.5 py-2 flex flex-wrap items-center justify-between sm:justify-end gap-3 sm:gap-4">
      
      <!-- Signal Strength Meter (Linked to 3D Antenna) -->
      <div class="flex items-center gap-2.5" title="Extend the 3D telescopic antenna to boost reception">
        <span class="text-[11px] uppercase tracking-wider text-royal-goldLight/80 font-medium hidden sm:inline">Signal</span>
        <div class="flex items-end gap-1 h-4 px-2 py-0.5 rounded-lg bg-black/40 border border-royal-gold/20" id="signal-bars">
          <div class="w-1 h-1.5 rounded-xs bg-emerald-400 transition-all duration-300"></div>
          <div class="w-1 h-2 rounded-xs bg-emerald-400 transition-all duration-300"></div>
          <div class="w-1 h-2.5 rounded-xs bg-emerald-400 transition-all duration-300"></div>
          <div class="w-1 h-3 rounded-xs bg-slate-600 transition-all duration-300"></div>
          <div class="w-1 h-3.5 rounded-xs bg-slate-600 transition-all duration-300"></div>
        </div>
        <span id="signal-pct" class="text-xs font-mono text-emerald-400 w-9 text-right">68%</span>
      </div>

      <div class="h-4 w-[1px] bg-royal-gold/20 hidden sm:block"></div>

      <!-- 3D Camera Preset Buttons -->
      <div class="flex items-center gap-1.5">
        <button data-cam="hero" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-medium bg-royal-gold/25 text-royal-goldLight border border-royal-gold/50 hover:bg-royal-gold/35 transition">
          3/4 Hero
        </button>
        <button data-cam="front" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-medium bg-white/5 text-slate-300 border border-white/10 hover:border-royal-gold/40 hover:text-royal-goldLight transition">
          Dial Front
        </button>
        <button data-cam="antenna" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-medium bg-white/5 text-slate-300 border border-white/10 hover:border-royal-gold/40 hover:text-royal-goldLight transition">
          3D Antenna
        </button>
      </div>
    </div>
  </header>

  <!-- COLLAPSIBLE ROYAL STATION DRAWER -->
  <aside id="station-drawer" class="fixed top-28 sm:top-24 right-3 sm:right-5 bottom-28 sm:bottom-28 w-[calc(100vw-1.5rem)] sm:w-96 z-30 royal-glass rounded-2xl flex flex-col overflow-hidden transition-all duration-300 translate-x-[115%] opacity-0 pointer-events-none">
    <!-- Drawer Header -->
    <div class="p-4 border-b border-royal-gold/25 flex items-center justify-between bg-royal-950/60">
      <div>
        <h2 class="font-serif text-base font-bold text-royal-goldLight tracking-wide">Imperial Frequency Band</h2>
        <p class="text-[11px] text-slate-400">31 Live Akashvani & Betar Transmissions</p>
      </div>
      <button id="close-drawer-btn" class="w-8 h-8 rounded-xl bg-white/5 hover:bg-royal-gold/20 border border-royal-gold/30 flex items-center justify-center text-royal-goldLight transition" aria-label="Close Stations">
        ✕
      </button>
    </div>

    <!-- Search Input -->
    <div class="p-3 border-b border-royal-gold/15 bg-royal-900/40">
      <div class="relative">
        <input id="station-search" type="text" placeholder="Search station (e.g., Vividh, Kolkata, Betar)..." 
               class="w-full bg-royal-950/80 border border-royal-gold/30 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-royal-gold transition" />
        <svg class="w-4 h-4 text-royal-gold/70 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <!-- Scrollable Station List -->
    <div id="station-list" class="flex-1 overflow-y-auto royal-scroll p-2.5 space-y-1.5">
      <!-- Populated dynamically via JS -->
    </div>
  </aside>

  <!-- Toast / Stream Notification Banner -->
  <div id="stream-toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-30 pointer-events-none opacity-0 transition-all duration-300 px-4 py-2 rounded-full royal-glass border border-amber-400/50 text-xs text-amber-200 shadow-2xl flex items-center gap-2 max-w-[90vw] truncate">
    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse shrink-0"></span>
    <span id="toast-msg">Connecting to broadcast tower...</span>
  </div>

  <!-- BOTTOM ROYAL CONSOLE BAR -->
  <footer class="fixed bottom-3 left-3 right-3 sm:bottom-4 sm:left-5 sm:right-5 z-20 pointer-events-none flex justify-center">
    <div class="pointer-events-auto w-full max-w-6xl royal-glass rounded-2xl p-3 sm:px-5 sm:py-3.5 flex flex-col lg:flex-row items-center justify-between gap-3">
      
      <!-- Left: Power, Prev, Play/Pause, Next & Now Playing -->
      <div class="flex items-center justify-between lg:justify-start gap-2.5 sm:gap-3 w-full lg:w-auto">
        
        <!-- Vintage Power Button -->
        <button id="power-btn" title="Toggle Radio Power" class="w-11 h-11 rounded-xl bg-gradient-to-b from-slate-800 to-slate-950 border border-royal-gold/40 hover:border-royal-gold flex items-center justify-center shadow-lg transition active:scale-95 shrink-0">

          </svg>
        </button>

        <!-- Transport Controls -->
        <div class="flex items-center gap-1.5 bg-royal-950/70 p-1 rounded-xl border border-royal-gold/20 shrink-0">
          <button id="prev-btn" title="Previous Station" class="w-9 h-9 rounded-lg hover:bg-royal-gold/20 text-royal-goldLight flex items-center justify-center transition active:scale-90">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          
          <button id="play-btn" title="Play / Pause Stream" class="w-10 h-10 rounded-lg bg-gradient-to-b from-royal-goldLight to-royal-goldDark text-royal-950 font-bold flex items-center justify-center shadow-md hover:brightness-110 transition active:scale-95">
            <svg id="play-icon" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

          </button>

          </div>

        <!-- 3D Antenna Extension Control -->
        <div class="flex items-center gap-2 flex-1 sm:flex-initial">

            Antenna
          </span>
          <input id="antenna-ext-slider" type="range" min="0" max="100" value="65" class="royal-slider w-20 sm:w-24" />
        </div>

        <!-- 3D Antenna Tilt Control -->
        <div class="flex items-center gap-2 flex-1 sm:flex-initial">
          <span class="text-[11px] font-medium text-royal-goldLight/90 whitespace-nowrap">Tilt</span>
          <input id="antenna-tilt-slider" type="range" min="-45" max="45" value="18" class="royal-slider w-16 sm:w-20" />
        </div>

        <!-- Volume Control -->
        <div class="flex items-center gap-2 flex-1 sm:flex-initial">
          <button id="mute-btn" class="text-royal-goldLight hover:text-white transition" title="Mute / Unmute">
            <svg id="vol-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
          </button>
          <input id="volume-slider" type="range" min="0" max="100" value="80" class="royal-slider w-20 sm:w-24" />
        </div>
      </div>

      <!-- Right: Static SFX Toggle & Stations Drawer Button -->
      <div class="flex items-center justify-end gap-2 w-full lg:w-auto">
        <button id="sfx-toggle-btn" title="Toggle Analog Tuning Static Sound" class="px-3 py-2 rounded-xl text-xs font-medium bg-royal-gold/15 text-royal-goldLight border border-royal-gold/30 hover:bg-royal-gold/25 transition flex items-center gap-1.5">
          <span id="sfx-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span>Tube Static</span>
        </button>

        <button id="toggle-drawer-btn" class="flex-1 lg:flex-initial px-4 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-royal-800 to-royal-900 hover:from-royal-700 hover:to-royal-800 text-royal-goldLight border border-royal-gold/50 shadow-md transition flex items-center justify-center gap-2">
          <svg class="w-4 h-4 text-royal-gold" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/>
          </svg>
          <span>Stations (31)</span>
        </button>
      </div>

    </div>
  </footer>

    /**
     * ============================================================================
     * 3. WEB AUDIO API ANALOG TUNING STATIC GENERATOR
     * ============================================================================
     */
    let audioCtx = null;
    function playTuningStatic(duration = 0.38) {
      if (!state.sfxEnabled || !state.isPowered) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          // Crackle + analog white/pink static envelope
          const env = Math.sin((i / bufferSize) * Math.PI);
          const crackle = Math.random() > 0.96 ? (Math.random() * 2 - 1) * 1.6 : 0;
          output[i] = ((Math.random() * 2 - 1) * 0.25 + crackle * 0.35) * env;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        // Bandpass filter to emulate warm AM/MW tube radio static
        const bandpass = audioCtx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.value = 1450;
        bandpass.Q.value = 1.8;

        const gainNode = audioCtx.createGain();
        gainNode.gain.value = Math.min(0.22, state.volume * 0.28);

        whiteNoise.connect(bandpass);
        bandpass.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        whiteNoise.start();
      } catch (e) {
        // Ignore audio context autoplay restrictions until user clicks
      }
    }

    function playMechanicalClick() {
      if (!state.sfxEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.045);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.045);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    /**

    const audioEl = document.getElementById('radio-audio');

    function showToast(msg, isError = false) {
      const toast = document.getElementById('stream-toast');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {

    function stopStream() {
      if (hls) {
        hls.destroy();
        hls = null;

      audioEl.pause();
      audioEl.removeAttribute('src');
      audioEl.load();
      state.isPlaying = false;
      state.isBuffering = false;

    function tuneStation(index, autoPlay = true) {
      state.currentIndex = (index + STATIONS.length) % STATIONS.length;
      state.targetNeedlePos = state.currentIndex / (STATIONS.length - 1);
      state.tuningKnobAngle += 0.65;

      const station = STATIONS[state.currentIndex];
      updateUIState();
      renderStationList();
      updateDialTexture();

      if (!state.isPowered) {
        if (autoPlay) {
          togglePower(true);
        }
        return;
      }

      playTuningStatic(0.42);

      if (!autoPlay) {
        stopStream();
        return;
      }

      state.isBuffering = true;
      state.isPlaying = false;
      updateUIState();

      if (hls) {
        hls.destroy();
        hls = null;
      }

      audioEl.volume = state.isMuted ? 0 : state.volume;
      const src = station.src;

      if (src.endsWith('.m3u8') || src.includes('.m3u8')) {
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 30
          });
          hls.loadSource(src);
          hls.attachMedia(audioEl);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            audioEl.play().then(() => {
              state.isPlaying = true;
              state.isBuffering = false;
              updateUIState();
            }).catch(err => {
              state.isBuffering = false;
              updateUIState();
              showToast(`Tap Play to start ${station.name}`, false);
            });
          });
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              state.isBuffering = false;
              state.isPlaying = false;
              updateUIState();
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                showToast(`Signal weak or stream offline: ${station.name}`, true);
                hls.startLoad();
              } else {
                showToast(`Unable to lock signal for ${station.name}`, true);
              }
            }
          });
        } else if (audioEl.canPlayType('application/vnd.apple.mpegurl')) {
          // Native Safari HLS
          audioEl.src = src;
          audioEl.play().then(() => {
            state.isPlaying = true;
            state.isBuffering = false;
            updateUIState();
          }).catch(() => {
            state.isBuffering = false;
            updateUIState();
          });
        }
      } else {
        // Direct MP3/AAC Stream (e.g., Radio Bangladesh Betar)
        audioEl.src = src;
        audioEl.play().then(() => {
          state.isPlaying = true;
          state.isBuffering = false;
          updateUIState();
        }).catch(() => {
          state.isBuffering = false;
          state.isPlaying = false;
          updateUIState();
          showToast(`Stream temporarily unavailable: ${station.name}`, true);
        });
      }
    }

    audioEl.addEventListener('playing', () => {
      state.isPlaying = true;
      state.isBuffering = false;
      updateUIState();
    });

    audioEl.addEventListener('waiting', () => {
      if (state.isPowered) {
        state.isBuffering = true;
        updateUIState();
      }
    });

    audioEl.addEventListener('error', () => {
      if (state.isPowered && audioEl.src) {
        state.isBuffering = false;
        state.isPlaying = false;
        updateUIState();
        showToast(`Broadcast signal interrupted. Try next station.`, true);
      }
    });

    function togglePower(forceOn = null) {
      playMechanicalClick();

    function createMahoganyTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Deep Royal Mahogany / Rosewood Base
      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#2a0910');
      grad.addColorStop(0.5, '#1c050a');
      grad.addColorStop(1, '#26080f');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // Fine wood grain striations
      for (let i = 0; i < 420; i++) {
        const y = Math.random() * 512;
        ctx.strokeStyle = i % 3 === 0 ? 'rgba(65, 16, 22, 0.25)' : 'rgba(10, 2, 4, 0.35)';
        ctx.lineWidth = 1 + Math.random() * 2.2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(170, y + (Math.random() - 0.5) * 14, 340, y + (Math.random() - 0.5) * 14, 512, y);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createRoyalNavyLacquerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(256, 256, 30, 256, 256, 380);
      grad.addColorStop(0, '#101d47');
      grad.addColorStop(0.6, '#09112b');
      grad.addColorStop(1, '#050917');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // Subtle royal damask / metallic fleck micro-grain
      for (let i = 0; i < 1800; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(212, 175, 55, 0.03)' : 'rgba(255, 255, 255, 0.02)';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createSpeakerClothTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0c1329';
      ctx.fillRect(0, 0, 256, 256);

      // Woven Royal Gold & Midnight Thread Pattern
      for (let y = 0; y < 256; y += 6) {
        for (let x = 0; x < 256; x += 6) {
          const alt = ((x + y) / 6) % 2 === 0;
          ctx.fillStyle = alt ? '#b89428' : '#18264f';
          ctx.fillRect(x, y, 4, 4);
          ctx.fillStyle = 'rgba(255, 232, 150, 0.22)';
          ctx.fillRect(x, y, 2, 2);
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 5);
      return tex;
    }

    // Dynamic Analog Glass Dial Canvas

    function updateDialTexture() {
      const w = dialCanvas.width;

      const station = STATIONS[state.currentIndex];

      // Background glow (warm vacuum tube amber when ON, dark smoked glass when OFF)
      const bgGrad = dialCtx.createLinearGradient(0, 0, 0, h);

      dialCtx.fillText('MW  530 — 1600 kHz   |   SW1  6 — 18 MHz', w - 38, 52);

      // Horizontal Frequency Scale Lines
      const scaleLeft = 55;
      const scaleRight = w - 55;
      const scaleWidth = scaleRight - scaleLeft;

      dialCtx.strokeStyle = state.isPowered ? 'rgba(255, 225, 140, 0.65)' : 'rgba(148, 163, 184, 0.25)';
      dialCtx.lineWidth = 2;
      dialCtx.beginPath();
      dialCtx.moveTo(scaleLeft, 125);
      dialCtx.lineTo(scaleRight, 125);
      dialCtx.moveTo(scaleLeft, 195);
      dialCtx.lineTo(scaleRight, 195);
      dialCtx.stroke();

      // Frequency Ticks & kHz Numbers
      const freqs = ['550', '650', '750', '850', '1000', '1200', '1400', '1600'];
      for (let i = 0; i <= 60; i++) {
        const x = scaleLeft + (i / 60) * scaleWidth;
        const isMajor = i % 5 === 0;
        dialCtx.beginPath();
        dialCtx.moveTo(x, 125);
        dialCtx.lineTo(x, isMajor ? 148 : 136);
        dialCtx.stroke();

        dialCtx.beginPath();
        dialCtx.moveTo(x, 195);
        dialCtx.lineTo(x, isMajor ? 174 : 185);
        dialCtx.stroke();
      }

      dialCtx.font = 'bold 19px monospace';
      dialCtx.textAlign = 'center';
      dialCtx.fillStyle = state.isPowered ? '#ffd670' : '#475569';
      freqs.forEach((f, idx) => {
        const fx = scaleLeft + (idx / (freqs.length - 1)) * scaleWidth;
        dialCtx.fillText(f, fx, 168);
      });

      // Station Markers along the bottom band

        dialCtx.fillStyle = isCurrent

        dialCtx.beginPath();
        dialCtx.arc(sx, 212, isCurrent ? 5 : 2.5, 0, Math.PI * 2);
        dialCtx.fill();
      });

      dialCtx.fillRect(38, 242, w - 76, 82);

      dialCtx.textAlign = 'left';

      // Glowing Red Tuning Needle Indicator

      dialCtx.stroke();
      dialCtx.shadowBlur = 0;

    function update3DAntennaGeometry() {
      // Tilt in radians (tilts sideways/backwards gracefully)
      const tiltRad = THREE.MathUtils.degToRad(-state.antennaTilt);
      antennaPivot.rotation.z = tiltRad;
      antennaPivot.rotation.x = THREE.MathUtils.degToRad(-12);

      // Extend nested segments smoothly
      const ext = state.antennaExtension; // 0 to 1
      for (let i = 1; i < antennaSegments.length; i++) {
        // When ext=0, nested inside previous segment; when ext=1, fully extended
        const minOffset = 0.06;
        const maxOffset = segLen - 0.06;
        antennaSegments[i].position.y = minOffset + ext * (maxOffset - minOffset);
      }

      // Update Signal Strength UI based on Antenna Extension & Optimal Tilt
      const tiltPenalty = Math.abs(state.antennaTilt - 15) * 0.25;
      const rawSignal = Math.round(Math.min(100, Math.max(24, 34 + ext * 68 - tiltPenalty)));
      document.getElementById('signal-pct').textContent = `${rawSignal}%`;

      const bars = document.getElementById('signal-bars').children;
      const activeBars = Math.ceil((rawSignal / 100) * bars.length);
      for (let b = 0; b < bars.length; b++) {
        if (b < activeBars) {
          bars[b].classList.remove('bg-slate-600');
          bars[b].classList.add('bg-emerald-400');
        } else {
          bars[b].classList.remove('bg-emerald-400');
          bars[b].classList.add('bg-slate-600');
        }
      }
    }

    /**
     * ============================================================================
     * 7. 3D RAYCASTING FOR DIRECT INTERACTION ON KNOBS, SWITCH & ANTENNA
     * ============================================================================
     */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const hoverBadge = document.getElementById('hover-badge');
    const hoverBadgeText = document.getElementById('hover-badge-text');
    let hoveredAction = null;
    let pointerDownPos = { x: 0, y: 0 };

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(interactiveMeshes, false);

      if (hits.length > 0) {
        const hitData = hits[0].object.userData;
        hoveredAction = hitData.action;
        hoverBadgeText.textContent = hitData.label;
        hoverBadge.style.left = `${Math.min(window.innerWidth - 230, e.clientX + 14)}px`;
        hoverBadge.style.top = `${Math.max(60, e.clientY - 28)}px`;
        hoverBadge.classList.remove('opacity-0');
        container.style.cursor = 'pointer';
      } else {
        hoveredAction = null;
        hoverBadge.classList.add('opacity-0');
        container.style.cursor = 'grab';
      }
    });

    container.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    container.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      // Only trigger click action if user didn't drag to orbit camera
      if (dist < 6 && hoveredAction) {
        if (hoveredAction === 'power') {
          togglePower();
        } else if (hoveredAction === 'tune') {
          tuneStation(state.currentIndex + 1, true);
        } else if (hoveredAction === 'volume') {

    function updateUIState() {

      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');

      if (state.isPowered) {
        powerBtn.classList.add('border-emerald-400', 'shadow-emerald-500/30');
        powerIcon.classList.remove('text-slate-400');
        powerIcon.classList.add('text-emerald-400');

        if (state.isBuffering) {
          statusDot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
          statusText.textContent = 'TUNING...';
          statusText.className = 'text-amber-300';
        } else if (state.isPlaying) {
          statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
          statusText.textContent = 'ON AIR';
          statusText.className = 'text-emerald-300 font-semibold';
        } else {
          statusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
          statusText.textContent = 'READY';
          statusText.className = 'text-amber-200';
        }
      } else {
        powerBtn.classList.remove('border-emerald-400', 'shadow-emerald-500/30');
        powerIcon.classList.add('text-slate-400');
        powerIcon.classList.remove('text-emerald-400');
        statusDot.className = 'w-2 h-2 rounded-full bg-slate-500';
        statusText.textContent = 'STANDBY';
        statusText.className = 'text-slate-300';
      }

      if (state.isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      }
    }

    function renderStationList(filterText = '') {
      const listEl = document.getElementById('station-list');
      const query = filterText.trim().toLowerCase();
      listEl.innerHTML = '';

      STATIONS.forEach((st, idx) => {
        if (query && !st.name.toLowerCase().includes(query) && !st.freq.toLowerCase().includes(query)) {
          return;
        }
        const isCurrent = idx === state.currentIndex;
        const btn = document.createElement('button');
        btn.className = `w-full text-left px-3 py-2.5 rounded-xl border transition flex items-center justify-between gap-2 ${
          isCurrent
            ? 'bg-gradient-to-r from-royal-gold/25 to-royal-800/80 border-royal-gold text-white shadow-md'
            : 'bg-royal-950/50 hover:bg-royal-800/60 border-white/5 hover:border-royal-gold/30 text-slate-300'
        }`;

        btn.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="text-[11px] font-mono px-1.5 py-0.5 rounded ${
              isCurrent ? 'bg-royal-gold text-royal-950 font-bold' : 'bg-white/5 text-slate-400'
            }">${String(idx + 1).padStart(2, '0')}</span>
            <div class="min-w-0">
              <div class="text-xs sm:text-sm font-semibold truncate ${isCurrent ? 'text-royal-goldLight' : 'text-slate-100'}">${st.name}</div>
              <div class="text-[10px] font-mono text-slate-400">${st.freq}</div>
            </div>
          </div>
          ${isCurrent && state.isPlaying ? `
            <div class="flex items-end gap-0.5 h-3.5 shrink-0 pr-1">
              <span class="w-0.5 h-3 bg-emerald-400 eq-bar"></span>
              <span class="w-0.5 h-3 bg-emerald-400 eq-bar"></span>
              <span class="w-0.5 h-3 bg-emerald-400 eq-bar"></span>
              <span class="w-0.5 h-3 bg-emerald-400 eq-bar"></span>
            </div>
          ` : `<span class="text-[10px] text-royal-gold/60 shrink-0">TUNE</span>`}
        `;

        btn.addEventListener('click', () => {
          tuneStation(idx, true);
        });
        listEl.appendChild(btn);
      });
    }

    });

    document.getElementById('prev-btn').addEventListener('click', () => {
      tuneStation(state.currentIndex - 1, true);
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      tuneStation(state.currentIndex + 1, true);
    });

    document.getElementById('volume-slider').addEventListener('input', (e) => {
      setVolume(Number(e.target.value) / 100);
    });

    document.getElementById('mute-btn').addEventListener('click', () => {
      state.isMuted = !state.isMuted;
      audioEl.volume = state.isMuted ? 0 : state.volume;
      document.getElementById('vol-icon').style.opacity = state.isMuted ? '0.4' : '1';
    });

    document.getElementById('antenna-ext-slider').addEventListener('input', (e) => {
      state.antennaExtension = Number(e.target.value) / 100;
      update3DAntennaGeometry();
    });

    document.getElementById('antenna-tilt-slider').addEventListener('input', (e) => {
      state.antennaTilt = Number(e.target.value);
      update3DAntennaGeometry();
    });

    document.getElementById('sfx-toggle-btn').addEventListener('click', () => {
      state.sfxEnabled = !state.sfxEnabled;
      document.getElementById('sfx-dot').className = state.sfxEnabled
        ? 'w-1.5 h-1.5 rounded-full bg-emerald-400'
        : 'w-1.5 h-1.5 rounded-full bg-slate-500';
    });

    const drawerEl = document.getElementById('station-drawer');
    function setDrawerOpen(open) {
      state.drawerOpen = open;
      if (open) {
        drawerEl.classList.remove('translate-x-[115%]', 'opacity-0', 'pointer-events-none');
      } else {
        drawerEl.classList.add('translate-x-[115%]', 'opacity-0', 'pointer-events-none');
      }
    }

    document.getElementById('toggle-drawer-btn').addEventListener('click', () => {
      setDrawerOpen(!state.drawerOpen);
    });
    document.getElementById('close-drawer-btn').addEventListener('click', () => {
      setDrawerOpen(false);
    });

    document.getElementById('station-search').addEventListener('input', (e) => {
      renderStationList(e.target.value);
    });

    // Keyboard shortcuts (Left/Right arrows to tune stations, Space to play/pause)
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') tuneStation(state.currentIndex + 1, true);
      if (e.key === 'ArrowLeft') tuneStation(state.currentIndex - 1, true);
      if (e.key === ' ') {
        e.preventDefault();
        document.getElementById('play-btn').click();
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /**
     * ============================================================================
     * 10. ANIMATION LOOP (3D Knobs, Glowing Dial, Magic Eye, Smooth Camera)
     * ============================================================================
     */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // 1. Smoothly glide tuning needle on the analog glass dial
      const needleDiff = state.targetNeedlePos - state.needlePos;
      if (Math.abs(needleDiff) > 0.0005) {
        state.needlePos += needleDiff * Math.min(1, dt * 8);
        updateDialTexture();
      }

      // 2. Smoothly rotate 3D Volume & Tuning Knobs + Power Toggle Lever
      volumeKnob.rotation.z += (-state.volumeKnobAngle - volumeKnob.rotation.z) * Math.min(1, dt * 10);
      tuningKnob.rotation.z += (-state.tuningKnobAngle - tuningKnob.rotation.z) * Math.min(1, dt * 10);

      const targetSwitchRot = state.isPowered ? Math.PI * 0.14 : Math.PI * 0.38;
      switchLever.rotation.x += (targetSwitchRot - switchLever.rotation.x) * Math.min(1, dt * 12);

      // 3. Vacuum Tube Dial Glow & Magic Eye 6E5 Emerald Pulse
      const targetDialIntensity = state.isPowered ? 1.15 : 0.0;
      dialScreenMat.emissiveIntensity += (targetDialIntensity - dialScreenMat.emissiveIntensity) * Math.min(1, dt * 6);
      dialGlowLight.intensity = dialScreenMat.emissiveIntensity * 1.4;

      const targetPilotIntensity = state.isPowered ? 1.8 : 0.0;
      pilotLampMat.emissiveIntensity += (targetPilotIntensity - pilotLampMat.emissiveIntensity) * Math.min(1, dt * 8);

      if (state.isPowered) {
        const pulse = state.isPlaying
          ? 1.1 + Math.sin(elapsed * 7.5) * 0.35 + Math.cos(elapsed * 13) * 0.2
          : 0.75 + Math.sin(elapsed * 2.5) * 0.15;
        magicEyeMat.emissiveIntensity = pulse;
      } else {
        magicEyeMat.emissiveIntensity *= 0.85;
      }

      // 4. Smooth Camera Preset Interpolation
      if (targetCamPos && targetLookAt) {
        camera.position.lerp(targetCamPos, Math.min(1, dt * 4.5));
        controls.target.lerp(targetLookAt, Math.min(1, dt * 4.5));
        if (camera.position.distanceTo(targetCamPos) < 0.03) {
          targetCamPos = null;
          targetLookAt = null;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Initialize everything on window load
    window.onload = function () {
      update3DAntennaGeometry();
      updateDialTexture();
      renderStationList();
      updateUIState();
      animate();
    };
  </script>
</body>
</html>
