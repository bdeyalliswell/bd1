<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Six Seasons Portal - Pattern Lock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            min-height: 100vh;
            background-color: #080a09;
            background-image: 
                radial-gradient(circle at 18% 35%, rgba(16, 110, 65, 0.38) 0%, transparent 48%),
                radial-gradient(circle at 82% 45%, rgba(135, 22, 28, 0.35) 0%, transparent 50%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* --- PATTERN LOCK OVERLAY --- */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 9, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .lock-box {
            background: rgba(20, 22, 21, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85);
            border-radius: 28px;
            padding: 36px 28px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .lock-logo {
            width: 52px;
            height: 52px;
            background: #f5c518;
            color: #000;
            font-weight: 900;
            font-size: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 0 20px rgba(245, 197, 24, 0.4);
        }

        .lock-box h2 {
            font-size: 20px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        #status-text {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 20px;
            min-height: 18px;
            transition: color 0.2s;
        }

        /* --- 3x3 PATTERN PAD --- */
        .pattern-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto;
            touch-action: none; /* Prevents scrolling while drawing on mobile */
        }

        #pattern-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .dots-grid {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 2;
        }

        .dot-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .dot {
            width: 18px;
            height: 18px;
            background: rgba(255, 255, 255, 0.28);
            border-radius: 50%;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .dot::after {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }

        .dot-cell.active .dot {
            background: #10b981;
            transform: scale(1.25);
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.8);
        }

        .dot-cell.active .dot::after {
            border-color: rgba(16, 185, 129, 0.45);
        }

        .dot-cell.error .dot {
            background: #ef4444;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.8);
        }

        .dot-cell.error .dot::after {
            border-color: rgba(239, 68, 68, 0.45);
        }

        /* --- MAIN DASHBOARD --- */
        #dashboard {
            display: none;
            width: 100%;
            max-width: 920px;
            padding: 30px 20px 50px;
            flex-direction: column;
            align-items: center;
        }

        .top-header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 40px;
        }

        .brand-badge {
            background: #f5c518;
            color: #000;
            font-weight: 900;
            font-size: 18px;
            padding: 6px 14px;
            border-radius: 50px;
            letter-spacing: -0.5px;
            box-shadow: 0 0 18px rgba(245, 197, 24, 0.35);
        }

        .logout-btn {
            position: absolute;
            right: 0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        /* --- 6 SEASONS GRID --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            width: 100%;
            max-width: 780px;
        }

        .season-card {
            aspect-ratio: 1 / 1;
            background: rgba(18, 20, 19, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65);
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        border-color 0.28s, 
                        box-shadow 0.28s,
                        background 0.28s;
        }

        .season-card:hover {
            transform: translateY(-7px) scale(1.02);
            background: rgba(26, 29, 28, 0.95);
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.85);
        }

        .icon-wrap {
            width: 96px;
            height: 96px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .season-card:hover .icon-wrap {
            transform: scale(1.08);
        }

        .season-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .season-sub {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 3px;
        }

        @media (max-width: 720px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
                max-width: 460px;
            }
            .icon-wrap {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- PATTERN LOCK OVERLAY -->
    <div id="lock-screen">
        <div class="lock-box">
            <div class="lock-logo">BD</div>
            <h2>Draw Pattern</h2>
            <p id="status-text">Connect dots to unlock the 6 Seasons hub</p>
            
            <div class="pattern-wrapper" id="pattern-area">
                <canvas id="pattern-canvas" width="260" height="260"></canvas>
                <div class="dots-grid">
                    <div class="dot-cell" data-id="1"><div class="dot"></div></div>
                    <div class="dot-cell" data-id="2"><div class="dot"></div></div>
                    <div class="dot-cell" data-id="3"><div class="dot"></div></div>
                    <div class="dot-cell" data-id="4"><div class="dot"></div></div>
                    <div class="dot-cell" data-id="5"><div class="dot"></div></div>
                    <div class="dot-cell" data-id="6"><div class="dot"></div></div>
                    <div class="dot-cell" data-id="7"><div class="dot"></div></div>
                    <div class="dot-cell" data-id="8"><div class="dot"></div></div>
                    <div class="dot-cell" data-id="9"><div class="dot"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="dashboard">
        <div class="top-header">
            <div class="brand-badge">BD</div>
            <button class="logout-btn" onclick="lockPortal()">Lock</button>
        </div>

        <div class="grid-container">
            
            <!-- 1. SUMMER -->
            <a href="summer.html" class="season-card">
                <div class="icon-wrap">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <defs>
                            <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#fde047"/>
                                <stop offset="100%" stop-color="#f97316"/>
                            </radialGradient>
                        </defs>
                        <g stroke="#facc15" stroke-width="6" stroke-linecap="round">
                            <line x1="50" y1="8" x2="50" y2="18"/>
                            <line x1="50" y1="82" x2="50" y2="92"/>
                            <line x1="8" y1="50" x2="18" y2="50"/>
                            <line x1="82" y1="50" x2="92" y2="50"/>
                            <line x1="20" y1="20" x2="27" y2="27"/>
                            <line x1="73" y1="73" x2="80" y2="80"/>
                            <line x1="80" y1="20" x2="73" y2="27"/>
                            <line x1="27" y1="73" x2="20" y2="80"/>
                        </g>
                        <circle cx="50" cy="50" r="24" fill="url(#sunGrad)"/>
                    </svg>
                </div>
                <div class="season-title" style="color: #facc15;">Summer</div>
                <div class="season-sub">গ্রীষ্মকাল</div>
            </a>

            <!-- 2. MONSOON -->
            <a href="monsoon.html" class="season-card">
                <div class="icon-wrap">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <path d="M28 60 H74 A16 16 0 0 0 72 28 A22 22 0 0 0 30 32 A15 15 0 0 0 28 60 Z" fill="#38bdf8"/>
                        <path d="M24 62 H70 A14 14 0 0 0 68 34 A19 19 0 0 0 32 37 A13 13 0 0 0 24 62 Z" fill="#e0f2fe"/>
                        <g stroke="#0ea5e9" stroke-width="5" stroke-linecap="round">
                            <line x1="34" y1="70" x2="29" y2="84"/>
                            <line x1="50" y1="70" x2="45" y2="84"/>
                            <line x1="66" y1="70" x2="61" y2="84"/>
                        </g>
                    </svg>
                </div>
                <div class="season-title" style="color: #38bdf8;">Monsoon</div>
                <div class="season-sub">বর্ষাকাল</div>
            </a>

            <!-- 3. AUTUMN -->
            <a href="autumn.html" class="season-card">
                <div class="icon-wrap">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <path d="M22 65 H78 A16 16 0 0 0 75 33 A24 24 0 0 0 28 36 A16 16 0 0 0 22 65 Z" fill="#ffffff"/>
                        <path d="M35 72 H82 A12 12 0 0 0 80 48 A17 17 0 0 0 46 50 A12 12 0 0 0 35 72 Z" fill="#cbd5e1"/>
                        <circle cx="70" cy="26" r="10" fill="#38bdf8" opacity="0.45"/>
                    </svg>
                </div>
                <div class="season-title" style="color: #e2e8f0;">Autumn</div>
                <div class="season-sub">শরৎকাল</div>
            </a>

            <!-- 4. LATE AUTUMN -->
            <a href="lateautumn.html" class="season-card">
                <div class="icon-wrap">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <path d="M25 75 C25 40, 55 20, 80 20 C80 50, 60 75, 25 75 Z" fill="#f59e0b"/>
                        <path d="M22 78 L72 28" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
                        <path d="M42 58 L42 40 M55 45 L55 30 M48 52 L65 52 M36 64 L52 64" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="season-title" style="color: #fbbf24;">Late Autumn</div>
                <div class="season-sub">হেমন্তকাল</div>
            </a>

            <!-- 5. WINTER -->
            <a href="winter.html" class="season-card">
                <div class="icon-wrap">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <g stroke="#67e8f9" stroke-width="5" stroke-linecap="round">
                            <line x1="50" y1="14" x2="50" y2="86"/>
                            <line x1="19" y1="32" x2="81" y2="68"/>
                            <line x1="81" y1="32" x2="19" y2="68"/>
                            <polyline points="42,24 50,32 58,24" fill="none"/>
                            <polyline points="42,76 50,68 58,76" fill="none"/>
                            <polyline points="24,42 34,40 31,30" fill="none"/>
                            <polyline points="76,58 66,60 69,70" fill="none"/>
                            <polyline points="69,30 66,40 76,42" fill="none"/>
                            <polyline points="31,70 34,60 24,58" fill="none"/>
                        </g>
                        <circle cx="50" cy="50" r="7" fill="#cffafe"/>
                    </svg>
                </div>
                <div class="season-title" style="color: #67e8f9;">Winter</div>
                <div class="season-sub">শীতকাল</div>
            </a>

            <!-- 6. SPRING -->
            <a href="spring.html" class="season-card">
                <div class="icon-wrap">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <circle cx="50" cy="27" r="14" fill="#f472b6"/>
                        <circle cx="72" cy="43" r="14" fill="#ec4899"/>
                        <circle cx="64" cy="69" r="14" fill="#f472b6"/>
                        <circle cx="36" cy="69" r="14" fill="#ec4899"/>
                        <circle cx="28" cy="43" r="14" fill="#f472b6"/>
                        <circle cx="50" cy="50" r="12" fill="#fde047"/>
                    </svg>
                </div>
                <div class="season-title" style="color: #f472b6;">Spring</div>
                <div class="season-sub">বসন্তকাল</div>
            </a>

        </div>
    </div>

    <script>
        // --- SET YOUR PATTERN HERE ---
        // Grid layout:
        // 1  2  3
        // 4  5  6
        // 7  8  9
        // "14789" draws an "L" shape from top-left to bottom-right
        const CORRECT_PATTERN = "152698";

        const lockScreen = document.getElementById("lock-screen");
        const dashboard = document.getElementById("dashboard");
        const statusText = document.getElementById("status-text");
        const patternArea = document.getElementById("pattern-area");
        const canvas = document.getElementById("pattern-canvas");
        const ctx = canvas.getContext("2d");
        const dotCells = document.querySelectorAll(".dot-cell");

        let isDrawing = false;
        let selectedDots = [];
        let currentPointer = null;

        // Check session state
        if (sessionStorage.getItem("bd_pattern_unlocked") === "true") {
            unlockPortal();
        }

        function getDotCenter(cell) {
            const areaRect = patternArea.getBoundingClientRect();
            const cellRect = cell.getBoundingClientRect();
            return {
                x: (cellRect.left - areaRect.left) + cellRect.width / 2,
                y: (cellRect.top - areaRect.top) + cellRect.height / 2
            };
        }

        function getPointerPos(e) {
            const areaRect = patternArea.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - areaRect.left,
                y: clientY - areaRect.top
            };
        }

        function checkHit(pos) {
            dotCells.forEach(cell => {
                const id = cell.dataset.id;
                if (!selectedDots.includes(id)) {
                    const center = getDotCenter(cell);
                    const dist = Math.hypot(pos.x - center.x, pos.y - center.y);
                    if (dist < 32) { // Hit radius
                        selectedDots.push(id);
                        cell.classList.add("active");
                    }
                }
            });
        }

        function drawLines(color = "#10b981") {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (selectedDots.length === 0) return;

            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();

            selectedDots.forEach((id, index) => {
                const cell = document.querySelector(`.dot-cell[data-id="${id}"]`);
                const center = getDotCenter(cell);
                if (index === 0) ctx.moveTo(center.x, center.y);
                else ctx.lineTo(center.x, center.y);
            });

            if (isDrawing && currentPointer) {
                ctx.lineTo(currentPointer.x, currentPointer.y);
            }
            ctx.stroke();
        }

        function startDraw(e) {
            resetPattern();
            isDrawing = true;
            const pos = getPointerPos(e);
            currentPointer = pos;
            checkHit(pos);
            drawLines();
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPointerPos(e);
            currentPointer = pos;
            checkHit(pos);
            drawLines();
        }

        function endDraw() {
            if (!isDrawing) return;
            isDrawing = false;
            currentPointer = null;

            const drawnPattern = selectedDots.join("");
            if (drawnPattern.length === 0) return;

            if (drawnPattern === CORRECT_PATTERN) {
                drawLines("#10b981");
                statusText.textContent = "Unlocked!";
                statusText.style.color = "#10b981";
                setTimeout(() => {
                    sessionStorage.setItem("bd_pattern_unlocked", "true");
                    unlockPortal();
                    resetPattern();
                }, 250);
            } else {
                drawLines("#ef4444");
                dotCells.forEach(c => {
                    if (c.classList.contains("active")) {
                        c.classList.remove("active");
                        c.classList.add("error");
                    }
                });
                statusText.textContent = "Wrong pattern! Try again.";
                statusText.style.color = "#f87171";
                setTimeout(resetPattern, 650);
            }
        }

        function resetPattern() {
            selectedDots = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dotCells.forEach(c => c.classList.remove("active", "error"));
            statusText.textContent = "Connect dots to unlock the 6 Seasons hub";
            statusText.style.color = "#9ca3af";
        }

        function unlockPortal() {
            lockScreen.style.display = "none";
            dashboard.style.display = "flex";
        }

        function lockPortal() {
            sessionStorage.removeItem("bd_pattern_unlocked");
            dashboard.style.display = "none";
            lockScreen.style.display = "flex";
            resetPattern();
        }

        // Mouse & Touch Event Listeners
        patternArea.addEventListener("mousedown", startDraw);
        window.addEventListener("mousemove", moveDraw);
        window.addEventListener("mouseup", endDraw);

        patternArea.addEventListener("touchstart", startDraw, { passive: false });
        window.addEventListener("touchmove", moveDraw, { passive: false });
        window.addEventListener("touchend", endDraw);
    </script>

</body>
</html>
